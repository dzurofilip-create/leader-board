<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE SÚBOJ KRAJÍN - ULTRA HD</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Oswald:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000000; /* Čierne pozadie, aby sa ti výrez dobre orezával/klíčoval */
            min-height: 100vh;
            padding: 30px;
            color: white;
            overflow-y: auto; /* Povolené scrollovanie, aby panel nezavadzal tabuľke pri zúžení */
        }

        /* Flex-wrap zabezpečí, že ak okno zúžiš, panel padne POD tabuľku a vo výreze ti nebude zavadzať */
        .wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            justify-content: center;
            align-items: flex-start;
            margin-top: 130px; /* Obrovské odsadenie kvôli gigantickému WINS počítadlu */
        }

        /* ======================================================== */
        /* WINOV POČÍTADLO - ULTRA GIGANTICKÉ */
        /* ======================================================== */
        .wins-counter {
            position: fixed;
            left: 50%;
            top: 25px;
            transform: translateX(-50%);
            font-family: 'Oswald', sans-serif;
            font-size: 64px; /* Extrémne veľké, aby bolo ostré aj z diaľky */
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: transparent;
            color: #39ff14; 
            text-shadow: 0 0 25px rgba(57, 255, 20, 0.85), 4px 4px 4px #000, -4px -4px 4px #000, 4px -4px 4px #000, -4px 4px 4px #000;
            z-index: 9999;
            white-space: nowrap;
        }

        .wins-negative {
            color: #ff3333 !important;
            text-shadow: 0 0 25px rgba(255, 51, 51, 0.85), 4px 4px 4px #000, -4px -4px 4px #000, 4px -4px 4px #000, -4px 4px 4px #000 !important;
        }

        /* ======================================================== */
        /* LEADERBOARD - MASÍVNE ZVÄČŠENÝ PRE DOBRÝ VÝREZ */
        /* ======================================================== */
        .container {
            width: 600px; /* Viac než dvojnásobná šírka oproti predošlej verzii */
        }

        #leaderboard {
            display: flex;
            flex-direction: column;
            position: relative;
            background: rgba(0, 0, 0, 0.75); 
            backdrop-filter: blur(8px); 
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 0 35px 10px rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .title {
            font-family: 'Oswald', sans-serif;
            font-size: 36px; /* Obrovský čitateľný nadpis */
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px; 
            border-bottom: 3px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 12px;
            text-shadow: 2px 2px 4px #000;
        }

        .countries-holder {
            position: relative;
            width: 100%;
        }

        /* MASÍVNY RIADOK ŠTÁTU (Výška 65px) */
        .country-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 65px; 
            padding: 0 20px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
        }

        /* Gradienty */
        .bg-sk { background: linear-gradient(90deg, #051a59 0%, #102570 35%, #800f1b 100%); }
        .bg-cz { background: linear-gradient(90deg, #2c3545 0%, #444f63 35%, #8c121a 100%); }
        .bg-de { background: linear-gradient(90deg, #050505 0%, #800a0f 50%, #947109 100%); }
        .bg-at { background: linear-gradient(90deg, #850c18 0%, #9e1321 40%, #3d4552 100%); }
        .bg-hu { background: linear-gradient(90deg, #0b3b1a 0%, #125427 40%, #8c121f 100%); }
        .bg-hr { background: linear-gradient(90deg, #071f5c 0%, #12317a 40%, #940c18 100%); }
        .bg-pl { background: linear-gradient(90deg, #333d4d 0%, #4f5b6e 40%, #910b22 100%); }
        .bg-ua { background: linear-gradient(90deg, #03246e 0%, #083ba3 45%, #947a07 100%); }
        .bg-ru { background: linear-gradient(90deg, #052263 0%, #0b3696 45%, #91111a 100%); }
        .bg-al { background: linear-gradient(90deg, #050505 0%, #1c0305 45%, #9c0c16 100%); }

        .rank {
            font-family: 'Oswald', sans-serif;
            font-size: 32px; 
            font-weight: 800;
            width: 50px;
            color: #ffffff; 
            text-shadow: 2px 2px 3px #000;
        }

        .rank-1 { color: #ffd700 !important; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6), 2px 2px 2px #000; }
        .rank-2 { color: #e0e0e0 !important; text-shadow: 0 0 10px rgba(224, 224, 224, 0.5), 2px 2px 2px #000; }
        .rank-3 { color: #cd7f32 !important; text-shadow: 0 0 10px rgba(205, 127, 50, 0.5), 2px 2px 2px #000; }

        .country-left {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-grow: 1;
        }

        .flag {
            width: 55px; 
            height: 36px;
            object-fit: cover;
            border-radius: 4px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .country-name {
            color: #ffffff; 
            font-size: 26px; 
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 240px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        .country-right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .score {
            font-family: 'Oswald', sans-serif;
            font-size: 32px; 
            font-weight: 800;
            color: #ffffff; 
            text-shadow: 2px 2px 3px #000;
        }

        .score-1 { color: #ffd700 !important; }
        .score-2 { color: #e0e0e0 !important; }
        .score-3 { color: #cd7f32 !important; }

        .flash-card {
            animation: scorePop 0.4s ease-in-out;
            z-index: 10;
        }

        @keyframes scorePop {
            0% { transform: scale(1); filter: brightness(1); }
            30% { transform: scale(1.04); filter: brightness(1.4) saturate(1.2); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* ======================================================== */
        /* OVLÁDACÍ PANEL - ČISTÝ A ČITATEĽNÝ PRE TEBA NA DRUHOM OKNE */
        /* ======================================================== */
        .controls {
            width: 320px;
            padding: 20px;
            border-radius: 16px;
            background: rgba(20, 25, 35, 0.98);
            border: 2px solid rgba(255,255,255,0.15);
            height: fit-content;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        .controls h2 { color: white; margin-bottom: 15px; font-size: 22px; font-family: 'Oswald', sans-serif; text-align: center;}
        .controls label { color: #bbb; display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
        .controls select, .controls input { width: 100%; height: 42px; border: 2px solid rgba(255,255,255,0.15); border-radius: 8px; margin-bottom: 15px; padding: 0 12px; font-size: 15px; background: rgba(255,255,255,0.05); color: white; }
        .controls option { color: black; }
        
        .manual-btn { width: 100%; height: 46px; border: none; border-radius: 10px; color: white; font-size: 16px; font-weight: 800; cursor: pointer; transition: .2s; background: linear-gradient(135deg, #00c6ff, #0072ff); margin-bottom: 15px; }
        .manual-btn:hover { transform: scale(1.02); }

        .win-controls-row { display: flex; gap: 10px; }
        .win-btn { flex: 1; height: 42px; border: none; border-radius: 8px; color: white; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .win-btn-plus { background: linear-gradient(135deg, #28a745, #218838); }
        .win-btn-minus { background: linear-gradient(135deg, #dc3545, #c82333); }
        .win-btn:hover { transform: scale(1.04); }
    </style>
</head>
<body>

<!-- Počítadlo WINS (Obrie na vrchu) -->
<div id="winsDisplay" class="wins-counter">0 / 10 WINS</div>

<div class="wrapper">

    <!-- Tabuľka poradia (To, čo budeš orezávať) -->
    <div class="container">
        <div id="leaderboard">
            <div class="title">PORADIE KRAJÍN</div>
            <div id="countriesHolder" class="countries-holder"></div>
        </div>
    </div>

    <!-- Ovládací panel -->
    <div class="controls">
        <h2>🎮 Ovládací panel</h2>
        
        <label>Krajina</label>
        <select id="countrySelect">
            <option value="Slovensko">🇸🇰 Slovensko</option>
            <option value="Nemecko">🇩🇪 Nemecko</option>
            <option value="Rakúsko">🇦🇹 Rakúsko</option>
            <option value="Česko">🇨🇿 Česko</option>
            <option value="Maďarsko">🇭🇺 Maďarsko</option>
            <option value="Chorvátsko">🇭🇷 Chorvátsko</option>
            <option value="Poľsko">🇵🇱 Poľsko</option>
            <option value="Ukrajina">🇺🇦 Ukrajina</option>
            <option value="Rusko">🇷🇺 Rusko</option>
            <option value="Albánsko">🇦🇱 Albánsko</option>
        </select>

        <label>Koľko pridať bodov</label>
        <input type="number" id="amountInput" placeholder="Napr. 500" />

        <button class="manual-btn" onclick="manualAdd()">➕ Pridať body</button>

        <label>🏆 Správa WINS (Koľko chcem)</label>
        <input type="number" id="winAmountInput" placeholder="Napr. 1" value="1" />
        <div class="win-controls-row">
            <button class="win-btn win-btn-minus" onclick="manualChangeWins(-1)">➖ Odobrať</button>
            <button class="win-btn win-btn-plus" onclick="manualChangeWins(1)">➕ Pridať</button>
        </div>
    </div>

</div>

<script>
    const socket = new WebSocket("ws://localhost:3000");

    let currentWins = 0;
    const maxWins = 10;

    let countries = [
        { id: "sk", name:"Slovensko", code:"sk", score:0, flash:false },
        { id: "de", name:"Nemecko", code:"de", score:0, flash:false },
        { id: "at", name:"Rakúsko", code:"at", score:0, flash:false },
        { id: "cz", name:"Česko", code:"cz", score:0, flash:false },
        { id: "hu", name:"Maďarsko", code:"hu", score:0, flash:false },
        { id: "hr", name:"Chorvátsko", code:"hr", score:0, flash:false },
        { id: "pl", name:"Poľsko", code:"pl", score:0, flash:false },
        { id: "ua", name:"Ukrajina", code:"ua", score:0, flash:false },
        { id: "ru", name:"Rusko", code:"ru", score:0, flash:false },
        { id: "al", name:"Albánsko", code:"al", score:0, flash:false }
    ];

    function initLeaderboard() {
        const holder = document.getElementById("countriesHolder");
        holder.innerHTML = "";
        
        countries.forEach((country) => {
            holder.innerHTML += `
            <div id="card-${country.id}" class="country-card bg-${country.code}">
                <div class="country-left">
                    <div id="rank-${country.id}" class="rank">#0</div>
                    <img class="flag" src="https://flagcdn.com/w80/${country.code}.png">
                    <div class="country-name">${country.name}</div>
                </div>
                <div class="country-right">
                    <div id="score-${country.id}" class="score">0</div>
                </div>
            </div>
            `;
        });
        
        // Upravené pre novú výšku 65px + 6px medzera medzi riadkami
        holder.style.height = `${(countries.length * (65 + 6)) - 6}px`;
        updateWinsDisplay();
        renderLeaderboard();
    }

    function updateWinsDisplay() {
        const winsDisplay = document.getElementById("winsDisplay");
        winsDisplay.innerText = `${currentWins} / ${maxWins} WINS`;

        if (currentWins < 0) {
            winsDisplay.classList.add("wins-negative");
        } else {
            winsDisplay.classList.remove("wins-negative");
        }
    }

    function manualChangeWins(direction) {
        const inputVal = parseInt(document.getElementById("winAmountInput").value);
        if (isNaN(inputVal) || inputVal <= 0) return;

        const totalChange = inputVal * direction;
        currentWins += totalChange;
        updateWinsDisplay();

        if (socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: "winsUpdate", wins: currentWins }));
        }
    }

    function renderLeaderboard(){
        countries.sort((a,b) => b.score - a.score);

        countries.forEach((country, index) => {
            const cardEl = document.getElementById(`card-${country.id}`);
            const rankEl = document.getElementById(`rank-${country.id}`);
            const scoreEl = document.getElementById(`score-${country.id}`);

            if (!cardEl) return;

            // Výpočet pozície pre výšku 65px + 6px medzera
            cardEl.style.transform = `translateY(${index * (65 + 6)}px)`;
            cardEl.style.position = "absolute";
            cardEl.style.top = "0px";
            cardEl.style.left = "0px";
            cardEl.style.width = "100%";

            rankEl.innerText = `#${index + 1}`;
            scoreEl.innerText = country.score.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");

            rankEl.className = "rank";
            scoreEl.className = "score";

            if (index === 0) {
                rankEl.classList.add("rank-1");
                scoreEl.classList.add("score-1");
            } else if (index === 1) {
                rankEl.classList.add("rank-2");
                scoreEl.classList.add("score-2");
            } else if (index === 2) {
                rankEl.classList.add("rank-3");
                scoreEl.classList.add("score-3");
            }

            if (country.flash) {
                cardEl.classList.add("flash-card");
            } else {
                cardEl.classList.add("flash-card");
                cardEl.offsetHeight; 
                cardEl.classList.remove("flash-card");
            }
        });
    }

    function addPoints(data){
        const country = countries.find(c => c.name === data.country);
        if(!country) return;

        if(data.points){
            country.score += data.points;
        }

        country.flash = true;
        renderLeaderboard();

        setTimeout(() => {
            country.flash = false;
            renderLeaderboard();
        }, 400);
    }

    function manualAdd(){
        const countryName = document.getElementById("countrySelect").value;
        const amount = parseInt(document.getElementById("amountInput").value);

        if(!amount || amount <= 0) return;

        const payload = {
            country: countryName,
            points: amount,
            gifts: 0
        };

        if (socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify(payload));
        }

        addPoints(payload);
        document.getElementById("amountInput").value = "";
    }

    socket.onopen = () => { console.log("Connected to live.js"); };
    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "winsUpdate") {
            currentWins = data.wins;
            updateWinsDisplay();
        } else {
            addPoints(data);
        }
    };
    socket.onerror = (err) => { console.log(err); };

    initLeaderboard();
</script>

</body>
</html>
