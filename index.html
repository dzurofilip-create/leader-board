<script src="/socket.io/socket.io.js"></script>

<script>

/* ========================= */
/* SOCKET */
/* ========================= */

const socket = io();

/* ========================= */
/* RANDOM ORDER */
/* ========================= */

function shuffle(array){

    for(let i = array.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
        [array[j], array[i]];
    }

    return array;
}

/* ========================= */
/* COUNTRIES */
/* ========================= */

let countries = shuffle([

{
    name:"Slovensko",
    code:"sk",
    score:0,
    gifts:0,
    flash:false
},

{
    name:"Nemecko",
    code:"de",
    score:0,
    gifts:0,
    flash:false
},

{
    name:"Rakúsko",
    code:"at",
    score:0,
    gifts:0,
    flash:false
},

{
    name:"Česko",
    code:"cz",
    score:0,
    gifts:0,
    flash:false
},

{
    name:"Maďarsko",
    code:"hu",
    score:0,
    gifts:0,
    flash:false
},

{
    name:"Chorvátsko",
    code:"hr",
    score:0,
    gifts:0,
    flash:false
},

{
    name:"Poľsko",
    code:"pl",
    score:0,
    gifts:0,
    flash:false
},

{
    name:"Ukrajina",
    code:"ua",
    score:0,
    gifts:0,
    flash:false
},

{
    name:"Srbsko",
    code:"rs",
    score:0,
    gifts:0,
    flash:false
},

{
    name:"Albánsko",
    code:"al",
    score:0,
    gifts:0,
    flash:false
}

]);

/* ========================= */
/* RENDER */
/* ========================= */

function renderLeaderboard(){

    const leaderboard =
        document.getElementById("leaderboard");

    leaderboard.innerHTML = "";

    countries.sort((a,b)=>{

        if(b.score === a.score){

            return b.gifts - a.gifts;
        }

        return b.score - a.score;

    });

    countries.forEach((country,index)=>{

        leaderboard.innerHTML += `

        <div class="
            country-card
            ${index === 0 ? "top-country" : ""}
            ${country.flash ? "flash-card" : ""}
        ">

            ${
                index === 0
                ?
                `
                <div class="leader">
                    LEADER
                </div>
                `
                :
                ""
            }

            <div class="country-left">

                <div class="rank">
                    #${index + 1}
                </div>

                <img
                    class="flag"
                    src="https://flagcdn.com/w80/${country.code}.png"
                >

                <div class="country-name">
                    ${country.name}
                </div>

                ${
                    index === 0
                    ?
                    `<div class="live-dot"></div>`
                    :
                    ""
                }

            </div>

            <div class="country-right">

                <button class="score">
                    ${country.score} B
                </button>

                <button class="gift">
                    🏆 ${country.gifts}
                </button>

            </div>

            ${
                country.flash
                ?
                `
                <div class="points-popup">
                    +${country.lastPoints || 0}
                </div>
                `
                :
                ""
            }

        </div>
        `;
    });
}

/* ========================= */
/* MANUAL ADD */
/* ========================= */

function manualAdd(){

    const countryName =
        document.getElementById("countrySelect").value;

    const type =
        document.getElementById("typeSelect").value;

    const amount =
        parseInt(
            document.getElementById("amountInput").value
        );

    if(!amount || amount <= 0) return;

    addLivePoints({

        country:countryName,
        points:type === "score" ? amount : 0,
        gifts:type === "gifts" ? amount : 0

    });

    document.getElementById("amountInput").value = "";
}

/* ========================= */
/* LIVE ADD */
/* ========================= */

function addLivePoints(data){

    console.log("LIVE:", data);

    const oldLeader =
        [...countries]
        .sort((a,b)=>b.score-a.score)[0]?.name;

    const country =
        countries.find(
            c => c.name === data.country
        );

    if(!country){

        console.log(
            "COUNTRY NOT FOUND:",
            data.country
        );

        return;
    }

    country.score += data.points || 0;

    country.gifts += data.gifts || 0;

    country.lastPoints =
        data.points || 0;

    country.flash = true;

    renderLeaderboard();

    const newLeader =
        [...countries]
        .sort((a,b)=>b.score-a.score)[0]?.name;

    /* PREDBEHNUTIE */

    if(oldLeader !== newLeader){

        const card =
            document.querySelector(".top-country");

        if(card){

            card.classList.add("overtake");

            setTimeout(()=>{

                card.classList.remove("overtake");

            },1200);
        }
    }

    /* RESET FLASH */

    setTimeout(()=>{

        country.flash = false;

        renderLeaderboard();

    },1200);
}

/* ========================= */
/* SOCKET EVENT */
/* ========================= */

socket.on("gift",(data)=>{

    addLivePoints(data);

});

/* ========================= */
/* FIRST RENDER */
/* ========================= */

renderLeaderboard();

</script>
