<!DOCTYPE html>
<html lang="sk">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIVE SÚBOJ KRAJÍN</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:
        radial-gradient(circle at top left,#13294b,#081120 70%);

    min-height:100vh;

    padding:20px;

    overflow:hidden;
}

.wrapper{

    display:flex;

    gap:30px;
}

/* ========================= */
/* LEADERBOARD */
/* ========================= */

.container{

    width:760px;
}

.title{

    color:white;

    font-size:52px;

    font-weight:800;

    margin-bottom:30px;

    text-shadow:
        0 0 20px rgba(255,255,255,.15);
}

.country-card{

    display:flex;

    justify-content:space-between;

    align-items:center;

    width:100%;

    min-height:96px;

    padding:18px 24px;

    margin-bottom:18px;

    border-radius:28px;

    background:
        linear-gradient(
            135deg,
            rgba(35,58,90,.96),
            rgba(12,18,28,.96)
        );

    border:2px solid rgba(255,255,255,.08);

    transition:.3s;

    box-shadow:
        0 0 25px rgba(0,0,0,.25);
}

.country-card:hover{

    transform:scale(1.02);
}

.top-country{

    border:2px solid gold;

    box-shadow:
        0 0 30px gold,
        0 0 60px rgba(255,215,0,.25);
}

.flash-card{

    animation:flashAnim 1s ease;
}

@keyframes flashAnim{

    0%{

        transform:scale(1);
    }

    50%{

        transform:scale(1.05);

        box-shadow:
            0 0 50px rgba(0,255,255,.95);
    }

    100%{

        transform:scale(1);
    }
}

.country-left{

    display:flex;

    align-items:center;

    gap:18px;

    width:340px;

    min-width:340px;
}

.rank{

    width:50px;
    height:50px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#5b2dff;

    color:white;

    font-size:18px;

    font-weight:800;

    box-shadow:
        0 0 18px rgba(91,45,255,.55);
}

.flag{

    width:60px;

    height:42px;

    object-fit:cover;

    border-radius:8px;

    box-shadow:
        0 0 12px rgba(255,255,255,.15);
}

.country-name{

    color:white;

    font-size:30px;

    font-weight:800;

    width:220px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    text-shadow:
        0 0 10px rgba(255,255,255,.15);
}

.country-right{

    display:flex;

    justify-content:flex-end;

    align-items:center;

    gap:14px;

    min-width:340px;
}

.score,
.gift{

    width:160px;

    height:68px;

    flex-shrink:0;

    border:none;

    border-radius:18px;

    color:white;

    font-size:28px;

    font-weight:800;

    letter-spacing:.5px;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 0 18px rgba(0,0,0,.35),
        inset 0 0 10px rgba(255,255,255,.08);
}

.score{

    background:#1d3557;
}

.gift{

    background:#ff8800;
}

/* ========================= */
/* PANEL */
/* ========================= */

.controls{

    width:380px;

    padding:28px;

    border-radius:28px;

    background:
        linear-gradient(
            135deg,
            rgba(25,35,55,.96),
            rgba(10,15,25,.96)
        );

    border:2px solid rgba(255,255,255,.08);

    height:fit-content;

    box-shadow:
        0 0 30px rgba(0,0,0,.25);
}

.controls h2{

    color:white;

    margin-bottom:24px;

    font-size:32px;
}

.controls label{

    color:white;

    display:block;

    margin-bottom:10px;

    font-size:18px;

    font-weight:600;
}

.controls select,
.controls input{

    width:100%;

    height:60px;

    border:none;

    border-radius:16px;

    margin-bottom:22px;

    padding:0 16px;

    font-size:20px;

    background:
        rgba(255,255,255,.08);

    color:white;
}

.controls option{

    color:black;
}

.manual-btn{

    width:100%;

    height:64px;

    border:none;

    border-radius:18px;

    color:white;

    font-size:22px;

    font-weight:800;

    cursor:pointer;

    transition:.25s;

    background:
        linear-gradient(
            135deg,
            #00c6ff,
            #0072ff
        );

    box-shadow:
        0 0 25px rgba(0,114,255,.35);
}

.manual-btn:hover{

    transform:scale(1.03);

    box-shadow:
        0 0 35px rgba(0,180,255,.75);
}

</style>

</head>

<body>

<div class="wrapper">

<div class="container">

<div class="title">
🌍 LIVE SÚBOJ KRAJÍN
</div>

<div id="leaderboard"></div>

</div>

<div class="controls">

<h2>
🎮 Ovládací panel
</h2>

<label>Krajina</label>

<select id="countrySelect">

<option value="Slovensko">🇸🇰 Slovensko</option>
<option value="Nemecko">🇩🇪 Nemecko</option>
<option value="Rakúsko">🇦🇹 Rakúsko</option>
<option value="Česko">🇨🇿 Česko</option>
<option value="Maďarsko">🇭🇺 Maďarsko</option>
<option value="Chorvátsko">🇭🇷 Chorvátsko</option>
<option value="Poľsko">🇵🇱 Poľsko</option>
<option value="Ukrajina">🇺🇦 Ukrajina</option>
<option value="Srbsko">🇷🇸 Srbsko</option>
<option value="Albánsko">🇦🇱 Albánsko</option>

</select>

<label>Typ</label>

<select id="typeSelect">

<option value="score">
Body
</option>

<option value="gifts">
Tituly
</option>

</select>

<label>Koľko pridať</label>

<input
    type="number"
    id="amountInput"
    placeholder="Napr. 500"
/>

<button
    class="manual-btn"
    onclick="manualAdd()"
>
➕ Pridať
</button>

</div>

</div>

<script>

const socket = new WebSocket("ws://localhost:3000");

let countries = [

{ name:"Slovensko", code:"sk", score:0, gifts:0, flash:false },
{ name:"Nemecko", code:"de", score:0, gifts:0, flash:false },
{ name:"Rakúsko", code:"at", score:0, gifts:0, flash:false },
{ name:"Česko", code:"cz", score:0, gifts:0, flash:false },
{ name:"Maďarsko", code:"hu", score:0, gifts:0, flash:false },
{ name:"Chorvátsko", code:"hr", score:0, gifts:0, flash:false },
{ name:"Poľsko", code:"pl", score:0, gifts:0, flash:false },
{ name:"Ukrajina", code:"ua", score:0, gifts:0, flash:false },
{ name:"Srbsko", code:"rs", score:0, gifts:0, flash:false },
{ name:"Albánsko", code:"al", score:0, gifts:0, flash:false }

];

function renderLeaderboard(){

    const leaderboard =
        document.getElementById("leaderboard");

    leaderboard.innerHTML = "";

    countries
    .sort((a,b)=>b.score-a.score)
    .forEach((country,index)=>{

        leaderboard.innerHTML += `

        <div class="
            country-card
            ${index === 0 ? "top-country" : ""}
            ${country.flash ? "flash-card" : ""}
        ">

            <div class="country-left">

                <div class="rank">
                    #${index + 1}
                </div>

                <img
                    class="flag"
                    src="https://flagcdn.com/w80/${country.code}.png"
                >

                <div class="country-name">
                    ${country.name}
                </div>

            </div>

            <div class="country-right">

                <div class="score">
                    ${country.score} B
                </div>

                <div class="gift">
                    🏆 ${country.gifts}
                </div>

            </div>

        </div>

        `;
    });
}

function addPoints(data){

    const country =
        countries.find(
            c => c.name === data.country
        );

    if(!country) return;

    if(data.points){

        country.score += data.points;

    }

    if(data.gifts){

        country.gifts += data.gifts;

    }

    country.flash = true;

    renderLeaderboard();

    setTimeout(()=>{

        country.flash = false;

        renderLeaderboard();

    },1000);
}

function manualAdd(){

    const countryName =
        document.getElementById("countrySelect").value;

    const type =
        document.getElementById("typeSelect").value;

    const amount =
        parseInt(
            document.getElementById("amountInput").value
        );

    if(!amount || amount <= 0) return;

    const payload = {

        country:countryName,

        points:type === "score" ? amount : 0,

        gifts:type === "gifts" ? amount : 0

    };

    socket.send(JSON.stringify(payload));

    addPoints(payload);

    document.getElementById("amountInput").value = "";
}

socket.onopen = ()=>{

    console.log("Connected to live.js");

};

socket.onmessage = (event)=>{

    const data =
        JSON.parse(event.data);

    addPoints(data);

};

socket.onerror = (err)=>{

    console.log(err);

};

renderLeaderboard();

</script>

</body>
</html>
